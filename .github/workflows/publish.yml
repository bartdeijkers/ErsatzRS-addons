name: Validate and bundle private add-on repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag to validate and attach (blank validates main only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows-entrypoint-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install pinned media test dependencies
        run: python tools/setup_ci_test_tools.py
      - name: Test native Windows entrypoints
        run: python -m unittest discover -s tests

  validate-and-bundle:
    needs: windows-entrypoint-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install pinned media test dependencies
        run: python tools/setup_ci_test_tools.py
      - name: Validate manifests and provider adapters
        run: |
          cd tools/validator
          sha256sum --check SHA256SUMS
          cd ../..
          tools/validator/ersatzrs-addon-validator-x86_64-unknown-linux-gnu addons/*/addon.toml
          python3 -m unittest discover -s tests
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'
      - name: Test the shared ARMv7-compatible Node producer
        env:
          ERSATZRS_TVGUIDE_TEST_RUNTIME: node
        run: python3 -m unittest discover -s tests -p test_tvguide_teletext.py
      - name: Build complete offline repository bundle
        run: python3 tools/build_repository_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: ErsatzRS-addons
          path: dist/ErsatzRS-addons.zip
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: validate-and-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ErsatzRS-addons
          path: dist
      - name: Attach bundle to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/ErsatzRS-addons.zip --repo "$GITHUB_REPOSITORY" --clobber
