manifest_version = 4
id = "org.ersatzrs.addon.beeldengeluid"
version = "0.7.2"
license = "Zlib"
source_url = "https://github.com/bartdeijkers/ErsatzRS-addons/tree/main/addons/org.ersatzrs.addon.beeldengeluid"
host_version = ">=0.1.0, <0.2.0"

# Hosts this package offers to process for an operator-supplied source URL.
# Narrower than permissions.network_hosts on purpose: the CDN is contacted for
# media, but it is never a list or episode source an operator pastes.
default_source_hosts = ["schatkamer.beeldengeluid.nl"]

[icon]
path = "icon.png"
media_type = "png"

[name]
"en-US" = "Beeld & Geluid"
nl = "Beeld & Geluid"
"fr-FR" = "Beeld & Geluid"
pl = "Beeld & Geluid"
"pt-BR" = "Beeld & Geluid"

[summary]
"en-US" = "Stream Beeld & Geluid Schatkamer series, shared lists, and saved searches to ErsatzRS."
nl = "Stream series, gedeelde lijsten en bewaarde zoekopdrachten uit de Schatkamer van Beeld & Geluid naar ErsatzRS."
"fr-FR" = "Diffuse vers ErsatzRS les séries, listes partagées et recherches enregistrées de la Schatkamer de Beeld & Geluid."
pl = "Strumieniuje do ErsatzRS serie, udostępnione listy i zapisane wyszukiwania ze Schatkamer Beeld & Geluid."
"pt-BR" = "Transmite para o ErsatzRS séries, listas compartilhadas e buscas salvas da Schatkamer do Beeld & Geluid."

[[capabilities]]
id = "addon.check.v1"

[[capabilities]]
id = "remote-stream.list.v1"

[[capabilities]]
id = "remote-stream.list.v2"

[[capabilities]]
id = "remote-stream.list.v3"

[[capabilities]]
id = "remote-stream.play.v1"

[[capabilities]]
id = "media-list.list.v1"

[[capabilities]]
id = "media-list.list.v2"

[[capabilities]]
id = "media-list.list.v3"

[[capabilities]]
id = "media-list.list.v4"

[entrypoints."linux-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."win-x64"]
path = "addon.bat"
kind = "windows_batch"

[permissions]
network_hosts = ["schatkamer.beeldengeluid.nl", "sk-video.cdn.beeldengeluid.nl"]
media_read = false
managed_ffmpeg = true
external_commands = ["curl", "awk", "grep", "dd", "sed", "mktemp", "powershell.exe"]

[[settings]]
key = "MEDIA_STORAGE_PATH"
label = { "en-US" = "Media storage location", nl = "Opslaglocatie voor media", "fr-FR" = "Emplacement de stockage des médias", pl = "Lokalizacja przechowywania multimediów", "pt-BR" = "Local de armazenamento de mídia", "de-DE" = "Medienspeicherort", "it-IT" = "Percorso di archiviazione dei contenuti multimediali", "es-419" = "Ubicación de almacenamiento multimedia", "es-ES" = "Ubicación de almacenamiento multimedia" }
kind = "path"
required = false
options = []

[[settings]]
key = "CURL_BIN"
label = { "en-US" = "curl executable", nl = "curl-programma", "fr-FR" = "Exécutable curl", pl = "Program curl", "pt-BR" = "Executável curl" }
kind = "executable"
required = false
default = "curl"
options = []

[media_list_storage]
path_setting = "MEDIA_STORAGE_PATH"
default_subdirectory = "beeldengeluid_media"
source_name = "beeldengeluid"
