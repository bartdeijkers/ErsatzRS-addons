manifest_version = 6
id = "org.ersatzrs.addon.internet-archive"
version = "0.1.0"
license = "Zlib"
source_url = "https://github.com/bartdeijkers/ErsatzRS-addons/tree/main/addons/org.ersatzrs.addon.internet-archive"
host_version = ">=1.2.0, <1.4.0"

# Lists come from archive.org item, collection and search links. Playback
# follows the Archive's redirect to its storage hosts below archive.org.
default_source_hosts = ["archive.org", "www.archive.org"]

name = { "en-US" = "Internet Archive", "nl" = "Internet Archive", "de-DE" = "Internet Archive", "fr-FR" = "Internet Archive", "it-IT" = "Internet Archive", "pl" = "Internet Archive", "pt-BR" = "Internet Archive", "es-419" = "Internet Archive", "es-ES" = "Internet Archive" }
summary = { "en-US" = "Import public video from archive.org items, collections and searches as add-on lists.", "nl" = "Importeer openbare video van archive.org-items, -collecties en -zoekopdrachten als addon-lijsten.", "de-DE" = "Öffentliche Videos aus archive.org-Objekten, -Sammlungen und -Suchen als Add-on-Listen importieren.", "fr-FR" = "Importez des vidéos publiques d’éléments, collections et recherches archive.org comme listes d’extension.", "it-IT" = "Importa video pubblici da elementi, raccolte e ricerche di archive.org come liste del componente aggiuntivo.", "pl" = "Importuj publiczne filmy z elementów, kolekcji i wyszukiwań archive.org jako listy dodatku.", "pt-BR" = "Importe vídeos públicos de itens, coleções e buscas do archive.org como listas do complemento.", "es-419" = "Importa videos públicos de elementos, colecciones y búsquedas de archive.org como listas del complemento.", "es-ES" = "Importa vídeos públicos de elementos, colecciones y búsquedas de archive.org como listas del complemento." }

[[capabilities]]
id = "addon.check.v1"

[[capabilities]]
id = "media-list.list.v6"

[[capabilities]]
id = "remote-stream.list.v4"

[[capabilities]]
id = "remote-stream.play.v1"

[entrypoints."linux-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm"]
path = "addon-node.sh"
kind = "posix_shell"

[entrypoints."osx-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."win-x64"]
path = "addon.bat"
kind = "windows_batch"

[permissions]
network_hosts = ["archive.org", "*.archive.org"]
media_read = false
managed_ffmpeg = true
external_commands = ["deno", "node"]

[[settings]]
key = "MEDIA_STORAGE_PATH"
label = { "en-US" = "Media storage location", nl = "Opslaglocatie voor media", "fr-FR" = "Emplacement de stockage des médias", pl = "Lokalizacja przechowywania multimediów", "pt-BR" = "Local de armazenamento de mídia", "de-DE" = "Medienspeicherort", "it-IT" = "Percorso di archiviazione dei contenuti multimediali", "es-419" = "Ubicación de almacenamiento multimedia", "es-ES" = "Ubicación de almacenamiento multimedia" }
kind = "path"
required = false
options = []

[media_list_storage]
path_setting = "MEDIA_STORAGE_PATH"
default_subdirectory = "internet-archive_media"
source_name = "Internet Archive"
