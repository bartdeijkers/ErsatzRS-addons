label = { "en-US" = "Last output page", "nl" = "Laatste uitvoerpagina", "de-DE" = "Letzte Ausgabeseite", "fr-FR" = "Dernière page de sortie", "it-IT" = "Ultima pagina in uscita", "pl" = "Ostatnia strona wyjściowa", "pt-BR" = "Última página de saída", "es-419" = "Última página de salida", "es-ES" = "Última página de salida" }
