manifest_version = 1
id = "org.ersatzrs.addon.yt-dlp"
version = "0.1.1"
license = "Zlib"
source_url = "https://github.com/bartdeijkers/ErsatzRS-addons/tree/main/addons/org.ersatzrs.addon.yt-dlp"
host_version = ">=0.1.0, <0.2.0"

[name]
"en-US" = "yt-dlp Remote Streams"
nl = "yt-dlp Remote Streams"
"fr-FR" = "Flux distants yt-dlp"
pl = "Zdalne strumienie yt-dlp"
"pt-BR" = "Streams remotos yt-dlp"

[summary]
"en-US" = "Stream remote videos to ErsatzRS for playback through yt-dlp, not for downloading."
nl = "Stream video's via yt-dlp naar ErsatzRS om af te spelen, niet om te downloaden."
"fr-FR" = "Diffuse des vidéos vers ErsatzRS avec yt-dlp pour les lire, sans les télécharger."
pl = "Strumieniuje zdalne filmy przez yt-dlp do ErsatzRS w celu odtwarzania, a nie pobierania."
"pt-BR" = "Transmite vídeos remotos via yt-dlp para o ErsatzRS reproduzir, não para baixar."

[[capabilities]]
id = "addon.check.v1"

[[capabilities]]
id = "remote-stream.play.v1"

[entrypoints."linux-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."win-x64"]
path = "addon.bat"
kind = "windows_batch"

[permissions]
network_hosts = ["*"]
media_read = false
managed_ffmpeg = true
external_commands = ["yt-dlp", "powershell.exe"]

[[settings]]
key = "YT_DLP_BIN"
label = { "en-US" = "yt-dlp executable", nl = "yt-dlp-programma", "fr-FR" = "Exécutable yt-dlp", pl = "Program yt-dlp", "pt-BR" = "Executável yt-dlp" }
kind = "executable"
required = true
default = "yt-dlp"
options = []
