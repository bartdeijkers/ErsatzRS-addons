manifest_version = 1
id = "org.ersatzrs.addon.yt-dlp"
version = "0.1.0"
license = "GPL-3.0-or-later"
source_url = "https://github.com/bartdeijkers/ErsatzRS-addons/tree/main/addons/org.ersatzrs.addon.yt-dlp"
host_version = ">=0.1.0, <0.2.0"

[name]
"en-US" = "yt-dlp Remote Streams"
nl = "yt-dlp Remote Streams"
"fr-FR" = "Flux distants yt-dlp"
pl = "Zdalne strumienie yt-dlp"
"pt-BR" = "Streams remotos yt-dlp"

[summary]
"en-US" = "Play remote videos through an operator-installed yt-dlp."
nl = "Speel video's op afstand af via een door de beheerder geïnstalleerde yt-dlp."
"fr-FR" = "Lit des vidéos distantes avec yt-dlp installé par l'administrateur."
pl = "Odtwarza zdalne filmy przez yt-dlp zainstalowany przez administratora."
"pt-BR" = "Reproduz vídeos remotos usando um yt-dlp instalado pelo administrador."

[[capabilities]]
id = "addon.check.v1"

[[capabilities]]
id = "remote-stream.play.v1"

[entrypoints."linux-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."linux-arm"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-x64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."osx-arm64"]
path = "addon.sh"
kind = "posix_shell"

[entrypoints."win-x64"]
path = "addon.bat"
kind = "windows_batch"

[permissions]
network_hosts = ["*"]
media_read = false
managed_ffmpeg = true
external_commands = ["yt-dlp", "powershell.exe"]

[[settings]]
key = "YT_DLP_BIN"
label = { "en-US" = "yt-dlp executable", nl = "yt-dlp-programma", "fr-FR" = "Exécutable yt-dlp", pl = "Program yt-dlp", "pt-BR" = "Executável yt-dlp" }
kind = "executable"
required = true
default = "yt-dlp"
options = []
