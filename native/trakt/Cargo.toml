[package]
name = "ersatzrs-trakt-addon"
version = "0.2.0"
edition = "2021"
rust-version = "1.97.1"
license = "Zlib"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
strip = true
